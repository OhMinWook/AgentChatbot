version: '3.8'

services:
  # 1. 문서 파싱 서버 (기존 유지)
  unstructured-api:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: unstructured_api
    ports:
      - "8001:8000"
    environment:
      - UNSTRUCTURED_API_KEY=
    restart: on-failure

  # 2. Redis Stack (여기가 중요! 이미지 교체)
  redis:
    image: redis/redis-stack-server:latest  # alpine 아님! 검색 기능 포함된 버전
    container_name: otinus_redis
    ports:
      - "6379:6379"
    environment:
      - REDIS_ARGS=--save 60 1 --loglevel warning # 데이터 저장 옵션