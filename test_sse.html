<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Agentic RAG Test Console</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 900px; margin: 30px auto; padding: 20px; background-color: #f4f4f9; color: #333; }
        h1 { text-align: center; color: #444; }
        .container { display: flex; gap: 20px; }
        .left-panel { flex: 1; min-width: 300px; }
        .right-panel { flex: 2; }
        
        .section { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9em; color: #666; }
        input[type="text"], input[type="file"], textarea { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; transition: background 0.3s; margin-bottom: 5px; }
        button:hover { background: #0056b3; }
        button.secondary { background: #6c757d; }
        button.secondary:hover { background: #545b62; }
        
        /* File List */
        #fileList { list-style: none; padding: 0; margin: 0; max-height: 150px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
        #fileList li { padding: 8px; border-bottom: 1px solid #eee; cursor: pointer; display: flex; align-items: center; }
        #fileList li:hover { background-color: #f0f8ff; }
        #fileList li.selected { background-color: #e7f1ff; border-left: 4px solid #007bff; font-weight: bold; }
        #fileList li input[type="radio"] { margin-right: 10px; width: auto; }

        /* Progress Bar */
        #progressContainer { display: none; margin-top: 10px; background: #eee; border-radius: 4px; overflow: hidden; }
        #progressBar { width: 0%; height: 20px; background: #28a745; text-align: center; line-height: 20px; color: white; font-size: 12px; transition: width 0.3s; }

        /* Logs */
        #log { background: #1e1e1e; color: #d4d4d4; padding: 15px; border-radius: 8px; height: 500px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 13px; white-space: pre-wrap; line-height: 1.5; }
        .log-msg { margin-bottom: 5px; }
        .event-progress { color: #569cd6; }
        .event-clarification { color: #ce9178; font-weight: bold; border: 1px solid #ce9178; padding: 10px; border-radius: 4px; background: #2d2d2d; margin: 10px 0; }
        .event-references { color: #b5cea8; font-size: 0.9em; margin-top: 5px; }
        .event-answer { color: #4ec9b0; }
        .event-done { color: #608b4e; }
        .event-error { color: #f44747; }
        
        .hitl-form { margin-top: 10px; display: flex; gap: 10px; }
        .hitl-form input { flex: 1; margin-bottom: 0; }
        .hitl-form button { width: auto; margin-bottom: 0; }
        
        .mode-switch { display: flex; gap: 10px; margin-bottom: 10px; }
        .mode-switch label { cursor: pointer; display: flex; align-items: center; background: #eee; padding: 8px 15px; border-radius: 20px; font-weight: normal; }
        .mode-switch input:checked + span { font-weight: bold; color: #007bff; }

        /* RAG Debug Panel */
        #ragPanel { display: none; position: fixed; top: 50px; right: 20px; width: 500px; max-height: 80vh; background: #1e1e1e; border: 2px solid #007bff; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000; }
        #ragPanel.visible { display: block; }
        #ragPanelHeader { background: #007bff; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; cursor: move; }
        #ragPanelHeader h3 { margin: 0; font-size: 14px; }
        #ragPanelClose { background: none; border: none; color: white; font-size: 18px; cursor: pointer; width: auto; padding: 0 5px; margin: 0; }
        #ragPanelContent { padding: 10px; max-height: calc(80vh - 50px); overflow-y: auto; }
        .rag-doc { background: #2d2d2d; border: 1px solid #444; border-radius: 4px; margin-bottom: 10px; padding: 10px; font-family: 'Consolas', monospace; font-size: 12px; color: #d4d4d4; }
        .rag-doc-header { display: flex; justify-content: space-between; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid #444; }
        .rag-doc-score { color: #4ec9b0; font-weight: bold; }
        .rag-doc-source { color: #569cd6; }
        .rag-doc-content { white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; line-height: 1.4; }
        #ragToggleBtn { position: fixed; top: 10px; right: 20px; z-index: 999; background: #007bff; padding: 8px 15px; font-size: 12px; }

        /* Markdown Preview Panel */
        #mdPanel { display: none; position: fixed; top: 50px; left: 20px; width: 600px; max-height: 80vh; background: #1e1e1e; border: 2px solid #28a745; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 1000; }
        #mdPanel.visible { display: block; }
        #mdPanelHeader { background: #28a745; color: white; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; }
        #mdPanelHeader h3 { margin: 0; font-size: 14px; }
        #mdPanelClose { background: none; border: none; color: white; font-size: 18px; cursor: pointer; width: auto; padding: 0 5px; margin: 0; }
        #mdPanelContent { padding: 15px; max-height: calc(80vh - 50px); overflow-y: auto; font-family: 'Consolas', monospace; font-size: 12px; color: #d4d4d4; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }
        #mdToggleBtn { position: fixed; top: 10px; left: 20px; z-index: 999; background: #28a745; padding: 8px 15px; font-size: 12px; }
        .md-stats { background: #2d2d2d; padding: 8px 12px; border-radius: 4px; margin-bottom: 10px; font-size: 11px; color: #888; }
        .md-stats span { color: #4ec9b0; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🤖 Agentic RAG Test Console</h1>

    <!-- Debug Toggle Buttons -->
    <button id="mdToggleBtn" onclick="toggleMdPanel()">📝 마크다운 (0자)</button>
    <button id="ragToggleBtn" onclick="toggleRagPanel()">📄 RAG 문서 (0)</button>

    <!-- Markdown Preview Panel -->
    <div id="mdPanel">
        <div id="mdPanelHeader">
            <h3>📝 마크다운 변환 결과 (디버깅)</h3>
            <button id="mdPanelClose" onclick="toggleMdPanel()">×</button>
        </div>
        <div id="mdPanelContent">
            <p style="color: #888; text-align: center;">파일을 업로드하면 마크다운 변환 결과가 여기에 표시됩니다.</p>
        </div>
    </div>

    <!-- RAG Debug Panel -->
    <div id="ragPanel">
        <div id="ragPanelHeader">
            <h3>📄 RAG 검색 결과 (디버깅)</h3>
            <button id="ragPanelClose" onclick="toggleRagPanel()">×</button>
        </div>
        <div id="ragPanelContent">
            <p style="color: #888; text-align: center;">검색 결과가 여기에 표시됩니다.</p>
        </div>
    </div>

    <div class="container">
        <!-- Left Panel: Settings & Upload -->
        <div class="left-panel">
            <div class="section">
                <label>Server URL</label>
                <input type="text" id="serverUrl" value="http://localhost:8000">
                <label>Invoke ID (Room)</label>
                <input type="text" id="invokeId" value="test-room-001">
                <button class="secondary" onclick="loadFileList()">📂 파일 목록 새로고침</button>
            </div>

            <div class="section">
                <label>File Upload</label>
                <input type="file" id="fileInput">
                <div id="progressContainer">
                    <div id="progressBar">0%</div>
                </div>
                <div id="uploadStatus" style="font-size: 12px; color: #666; margin-top: 5px;"></div>
                <button onclick="uploadFile()">⬆️ 업로드 시작</button>
            </div>

            <div class="section" style="background: #fff3cd; border: 1px solid #ffc107;">
                <label>🧪 동시 업로드 테스트 (멀티프로세싱)</label>
                <input type="file" id="multiFileInput" multiple>
                <div id="multiUploadStatus" style="font-size: 12px; margin-top: 10px; max-height: 150px; overflow-y: auto;"></div>
                <button onclick="uploadMultipleFiles()" style="background: #ffc107; color: #333;">🚀 동시 업로드 시작</button>
                <div style="font-size: 11px; color: #856404; margin-top: 5px;">
                    여러 파일 선택 후 동시에 업로드하여 병렬 처리 테스트
                </div>
            </div>

            <div class="section">
                <label>Target File (Private Search)</label>
                <ul id="fileList">
                    <li style="color:#999; text-align:center;">파일 목록을 불러오세요.</li>
                </ul>
                <input type="hidden" id="selectedFile">
                <button onclick="summarizeDocument()" style="margin-top: 10px; background: #28a745;">📋 선택 파일 요약</button>
            </div>
        </div>

        <!-- Right Panel: Chat -->
        <div class="right-panel">
            <div class="section">
                <label>Chat Mode</label>
                <div class="mode-switch">
                    <label>
                        <input type="radio" name="chatMode" value="open" checked onclick="toggleFileSelection()">
                        <span>🌐 Open (전체 검색)</span>
                    </label>
                    <label>
                        <input type="radio" name="chatMode" value="private" onclick="toggleFileSelection()">
                        <span>🔒 Private (특정 파일)</span>
                    </label>
                </div>

                <label>Message</label>
                <textarea id="message" rows="3" placeholder="질문을 입력하세요... (예: 이 문서 요약해줘)"></textarea>
                <button onclick="sendMessage()">💬 전송</button>
                <button class="secondary" onclick="document.getElementById('log').innerHTML=''">로그 지우기</button>
            </div>

            <div class="section" style="padding: 0; background: none;">
                <div id="log"></div>
            </div>
        </div>
    </div>

    <script>
        const logDiv = document.getElementById('log');
        let currentThreadId = null;
        let streamingAnswerEl = null;
        let ragDocuments = [];  // RAG 문서 저장
        let markdownContent = '';  // 마크다운 저장

        function toggleRagPanel() {
            const panel = document.getElementById('ragPanel');
            panel.classList.toggle('visible');
        }

        function toggleMdPanel() {
            const panel = document.getElementById('mdPanel');
            panel.classList.toggle('visible');
        }

        function updateMdPanel(content, length, truncated = false) {
            markdownContent = content;
            const btn = document.getElementById('mdToggleBtn');
            const panelContent = document.getElementById('mdPanelContent');

            // 글자 수 포맷팅 (1000자 이상이면 K 단위)
            const lenStr = length >= 1000 ? `${(length / 1000).toFixed(1)}K` : length;
            btn.textContent = `📝 마크다운 (${lenStr}자)`;

            // 페이지 수 계산
            const pageMatches = content.match(/--- Page \d+ ---/g) || [];
            const pageCount = pageMatches.length;

            const truncateWarning = truncated ? '<span style="color: #f0ad4e;"> (일부만 표시)</span>' : '';
            let html = `<div class="md-stats">총 <span>${length.toLocaleString()}</span>자 | <span>${pageCount}</span>페이지${truncateWarning}</div>`;
            html += `<div>${escapeHtml(content)}</div>`;

            panelContent.innerHTML = html;

            // 자동으로 패널 열기
            document.getElementById('mdPanel').classList.add('visible');
        }

        function updateRagPanel(documents) {
            ragDocuments = documents;
            const btn = document.getElementById('ragToggleBtn');
            const content = document.getElementById('ragPanelContent');

            btn.textContent = `📄 RAG 문서 (${documents.length})`;

            if (documents.length === 0) {
                content.innerHTML = '<p style="color: #888; text-align: center;">검색 결과가 없습니다.</p>';
                return;
            }

            let html = '';
            documents.forEach((doc, idx) => {
                const score = doc.score !== undefined ? doc.score.toFixed(4) : 'N/A';
                const source = doc.metadata?.source || 'unknown';
                const page = doc.metadata?.page || '?';
                const docId = doc.doc_id || '-';
                const content_text = doc.content || '(내용 없음)';

                html += `
                    <div class="rag-doc">
                        <div class="rag-doc-header">
                            <span class="rag-doc-source">#${idx + 1} | ${source} (p.${page})</span>
                            <span class="rag-doc-score">Score: ${score}</span>
                        </div>
                        <div style="font-size: 10px; color: #666; margin-bottom: 5px;">ID: ${docId}</div>
                        <div class="rag-doc-content">${escapeHtml(content_text)}</div>
                    </div>
                `;
            });

            content.innerHTML = html;

            // 자동으로 패널 열기
            document.getElementById('ragPanel').classList.add('visible');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function log(msg, type = '') {
            const div = document.createElement('div');
            div.className = `log-msg event-${type}`;
            
            // HTML 렌더링을 위해 innerHTML 사용 (HITL 폼 삽입 등)
            if (type === 'html') {
                div.innerHTML = msg;
            } else {
                const time = new Date().toLocaleTimeString();
                div.textContent = `[${time}] ${msg}`;
            }
            
            logDiv.appendChild(div);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function toggleFileSelection() {
            const mode = document.querySelector('input[name="chatMode"]:checked').value;
            const fileList = document.getElementById('fileList');
            if (mode === 'private') {
                fileList.style.borderColor = '#007bff';
                if (!document.getElementById('selectedFile').value) {
                    alert('Private 모드는 파일 목록에서 검색할 파일을 선택해야 합니다.');
                }
            } else {
                fileList.style.borderColor = '#eee';
            }
        }

        async function loadFileList() {
            const serverUrl = document.getElementById('serverUrl').value;
            const invokeId = document.getElementById('invokeId').value;
            const listEl = document.getElementById('fileList');

            try {
                const res = await fetch(`${serverUrl}/files/${invokeId}`);
                const data = await res.json();
                
                listEl.innerHTML = '';
                if (data.files.length === 0) {
                    listEl.innerHTML = '<li style="color:#999; text-align:center;">업로드된 파일이 없습니다.</li>';
                    return;
                }

                data.files.forEach(file => {
                    const li = document.createElement('li');
                    li.innerHTML = `<input type="radio" name="fileSelect" value="${file}"> ${file}`;
                    li.onclick = () => {
                        document.querySelectorAll('#fileList li').forEach(el => el.classList.remove('selected'));
                        document.querySelectorAll('input[name="fileSelect"]').forEach(el => el.checked = false);
                        li.classList.add('selected');
                        li.querySelector('input').checked = true;
                        document.getElementById('selectedFile').value = file;
                        
                        // Private 모드로 자동 전환
                        document.querySelector('input[value="private"]').checked = true;
                        toggleFileSelection();
                    };
                    listEl.appendChild(li);
                });
                log(`파일 목록 갱신 완료 (${data.files.length}개)`, 'done');
            } catch (e) {
                log(`파일 목록 로드 실패: ${e.message}`, 'error');
            }
        }

        async function uploadFile() {
            const serverUrl = document.getElementById('serverUrl').value;
            const invokeId = document.getElementById('invokeId').value;
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];

            if (!file) return alert('파일을 선택해주세요.');

            const formData = new FormData();
            formData.append('attachFile_bin', file);
            // 파일명에 확장자 포함해서 전송
            formData.append('attachFile_name', file.name);

            document.getElementById('progressContainer').style.display = 'block';
            const progressBar = document.getElementById('progressBar');
            const statusText = document.getElementById('uploadStatus');

            log(`업로드 시작: ${file.name}`, 'progress');

            try {
                const response = await fetch(`${serverUrl}/upload/${invokeId}`, {
                    method: 'POST',
                    body: formData
                });

                log(`응답 상태: ${response.status} ${response.statusText}`, response.ok ? 'progress' : 'error');

                if (!response.ok) {
                    const errorText = await response.text();
                    log(`서버 에러: ${errorText}`, 'error');
                    return;
                }

                await handleSSE(response, (data) => {
                    if (data.type === 'progress') {
                        progressBar.style.width = `${data.percent}%`;
                        progressBar.textContent = `${data.percent}%`;
                        statusText.textContent = data.message;
                    } else if (data.type === 'markdown_preview') {
                        // 마크다운 변환 결과 표시
                        updateMdPanel(data.content, data.length, data.truncated || false);
                        const truncMsg = data.truncated ? ' (일부만 표시)' : '';
                        log(`[DEBUG] 마크다운 변환 완료: ${data.length}자${truncMsg}`, 'progress');
                    } else if (data.type === 'done') {
                        progressBar.style.width = '100%';
                        progressBar.textContent = '완료';
                        statusText.textContent = data.message;
                        log(`업로드 완료: ${data.message}`, 'done');
                        loadFileList(); // 목록 갱신
                    } else if (data.type === 'error') {
                        log(`업로드 에러: ${data.detail}`, 'error');
                    }
                });
            } catch (e) {
                log(`업로드 네트워크 오류: ${e.message}`, 'error');
            }
        }

        async function summarizeDocument() {
            const serverUrl = document.getElementById('serverUrl').value;
            const invokeId = document.getElementById('invokeId').value;
            const targetFile = document.getElementById('selectedFile').value;

            if (!targetFile) return alert('요약할 파일을 선택해주세요.');

            const formData = new FormData();
            formData.append('target_filename', targetFile);

            log(`[요약] ${targetFile} 요약 시작...`, 'progress');

            try {
                const response = await fetch(`${serverUrl}/message/document-summary/${invokeId}`, {
                    method: 'POST',
                    body: formData
                });

                await handleChatSSE(response);
            } catch (e) {
                log(`요약 요청 실패: ${e.message}`, 'error');
            }
        }

        async function sendMessage() {
            const serverUrl = document.getElementById('serverUrl').value;
            const invokeId = document.getElementById('invokeId').value;
            const message = document.getElementById('message').value;
            const mode = document.querySelector('input[name="chatMode"]:checked').value;
            const targetFile = document.getElementById('selectedFile').value;

            if (!message) return alert('메시지를 입력하세요.');

            const formData = new FormData();
            formData.append('message', message);

            let endpoint = '';
            if (mode === 'private') {
                if (!targetFile) return alert('Private 모드는 파일을 선택해야 합니다.');
                endpoint = `/message/private/${invokeId}`;
                formData.append('target_filename', targetFile);
                log(`[Private] ${targetFile} 검색 요청: ${message}`, 'progress');
            } else {
                endpoint = `/message/open/${invokeId}`;
                log(`[Open] 전체 검색 요청: ${message}`, 'progress');
            }

            try {
                const response = await fetch(`${serverUrl}${endpoint}`, {
                    method: 'POST',
                    body: formData
                });
                
                await handleChatSSE(response);
            } catch (e) {
                log(`채팅 요청 실패: ${e.message}`, 'error');
            }
        }

        async function sendContinue(responseMsg) {
            const serverUrl = document.getElementById('serverUrl').value;
            const invokeId = document.getElementById('invokeId').value;

            if (!currentThreadId) return alert('Thread ID가 없습니다.');

            const formData = new FormData();
            formData.append('thread_id', currentThreadId);
            formData.append('response', responseMsg);

            log(`명확화 응답 전송: ${responseMsg}`, 'progress');
            
            // 기존 입력폼 제거
            const form = document.getElementById(`hitl-${currentThreadId}`);
            if(form) form.remove();

            try {
                const res = await fetch(`${serverUrl}/message/${invokeId}/continue`, {
                    method: 'POST',
                    body: formData
                });
                await handleChatSSE(res);
            } catch (e) {
                log(`Continue 요청 실패: ${e.message}`, 'error');
            }
        }

        async function handleChatSSE(response) {
            streamingAnswerEl = null;  // 스트리밍 시작 시 초기화
            await handleSSE(response, (data) => {
                if (data.type === 'progress') {
                    // 문서 요약 진행률 표시
                    const msg = data.message || data.step || '';
                    const percent = data.percent !== undefined ? `[${data.percent}%] ` : '';
                    log(`${percent}${msg}`, 'progress');
                } else if (data.type === 'answer') {
                    // 첫 answer 청크이면 DOM 요소 생성, 이후는 append
                    if (!streamingAnswerEl) {
                        streamingAnswerEl = document.createElement('div');
                        streamingAnswerEl.className = 'log-msg event-answer';
                        logDiv.appendChild(streamingAnswerEl);
                    }
                    streamingAnswerEl.textContent += data.content;
                    logDiv.scrollTop = logDiv.scrollHeight;
                } else if (data.type === 'references') {
                    const refs = data.docs.map(d => `📄 ${d.source} (p.${d.page})`).join(', ');
                    log(`참고 문서: ${refs}`, 'references');
                } else if (data.type === 'rag_documents') {
                    // RAG 문서 디버깅 패널 업데이트
                    updateRagPanel(data.documents || []);
                    log(`[DEBUG] RAG 문서 ${data.documents?.length || 0}개 수신`, 'progress');
                } else if (data.type === 'clarification_needed') {
                    currentThreadId = data.thread_id;
                    const html = `
                        <div class="event-clarification" id="hitl-${data.thread_id}">
                            <div>🤖 <strong>AI의 질문:</strong> ${data.message}</div>
                            <div class="hitl-form">
                                <input type="text" id="input-${data.thread_id}" placeholder="답변을 입력하세요">
                                <button onclick="sendContinue(document.getElementById('input-${data.thread_id}').value)">전송</button>
                            </div>
                        </div>
                    `;
                    log(html, 'html');
                } else if (data.type === 'error') {
                    log(`에러 발생: ${data.message || data.detail}`, 'error');
                } else if (data.type === 'done') {
                    log('--- 답변 완료 ---', 'done');
                }
            });
        }

        async function uploadMultipleFiles() {
            const serverUrl = document.getElementById('serverUrl').value;
            const invokeId = document.getElementById('invokeId').value;
            const fileInput = document.getElementById('multiFileInput');
            const files = fileInput.files;
            const statusDiv = document.getElementById('multiUploadStatus');

            if (files.length === 0) return alert('파일을 선택해주세요.');

            statusDiv.innerHTML = '';
            const startTime = Date.now();

            log(`[동시 업로드] ${files.length}개 파일 시작`, 'progress');

            // 각 파일별 상태 표시 요소 생성
            const fileStatuses = {};
            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const div = document.createElement('div');
                div.style.cssText = 'padding: 5px; margin: 2px 0; background: #fff; border-radius: 4px; font-size: 12px;';
                div.innerHTML = `<strong>${file.name}</strong>: <span id="status-${i}">대기중...</span>`;
                statusDiv.appendChild(div);
                fileStatuses[i] = document.getElementById(`status-${i}`);
            }

            // 모든 파일을 동시에 업로드 (Promise.all)
            const uploadPromises = Array.from(files).map((file, idx) => {
                return uploadSingleFile(serverUrl, invokeId, file, idx, fileStatuses[idx]);
            });

            const results = await Promise.all(uploadPromises);
            const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
            const successCount = results.filter(r => r).length;

            log(`[동시 업로드 완료] ${successCount}/${files.length} 성공, 소요시간: ${elapsed}초`, 'done');
            loadFileList();
        }

        async function uploadSingleFile(serverUrl, invokeId, file, idx, statusEl) {
            const formData = new FormData();
            formData.append('attachFile_bin', file);
            formData.append('attachFile_name', file.name);

            statusEl.textContent = '업로드 중...';
            statusEl.style.color = '#007bff';

            try {
                const response = await fetch(`${serverUrl}/upload/${invokeId}`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    statusEl.textContent = `실패 (${response.status})`;
                    statusEl.style.color = '#dc3545';
                    return false;
                }

                // SSE 처리
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop() || '';

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));
                                if (data.type === 'progress') {
                                    statusEl.textContent = `${data.percent}% - ${data.message}`;
                                } else if (data.type === 'done') {
                                    statusEl.textContent = '✅ 완료';
                                    statusEl.style.color = '#28a745';
                                } else if (data.type === 'error') {
                                    statusEl.textContent = `❌ ${data.detail}`;
                                    statusEl.style.color = '#dc3545';
                                    return false;
                                }
                            } catch (e) {}
                        }
                    }
                }
                return true;
            } catch (e) {
                statusEl.textContent = `❌ 네트워크 오류`;
                statusEl.style.color = '#dc3545';
                return false;
            }
        }

        async function handleSSE(response, callback) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';  // 불완전한 라인을 저장할 버퍼

            console.log('[SSE] Starting to read stream...');

            while (true) {
                const { done, value } = await reader.read();
                if (done) {
                    console.log('[SSE] Stream ended');
                    break;
                }

                // 이전 버퍼와 새 청크를 합침
                buffer += decoder.decode(value, { stream: true });

                // 완전한 라인들만 처리 (마지막 불완전한 라인은 버퍼에 유지)
                const lines = buffer.split('\n');
                buffer = lines.pop() || '';  // 마지막 (불완전할 수 있는) 라인을 버퍼에 유지

                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        try {
                            const jsonStr = line.slice(6);
                            if (!jsonStr.trim()) continue;
                            const data = JSON.parse(jsonStr);
                            console.log('[SSE] Parsed data:', data.type);
                            callback(data);
                        } catch (e) {
                            console.error('SSE Parsing Error:', e);
                        }
                    }
                }
            }
        }
    </script>
