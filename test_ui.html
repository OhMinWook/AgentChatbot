<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Service 테스트 UI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }

  .top-bar {
    background: #1a1a2e; color: #fff;
    padding: 14px 24px; display: flex; align-items: center; gap: 16px;
  }
  .top-bar h1 { font-size: 16px; font-weight: 600; }
  .top-bar input {
    padding: 6px 12px; border-radius: 6px; border: none;
    font-size: 13px; width: 220px;
  }
  .top-bar label { font-size: 12px; color: #aaa; }

  .layout { display: flex; height: calc(100vh - 52px); }

  /* 사이드바 */
  .sidebar {
    width: 280px; background: #fff; border-right: 1px solid #e0e0e0;
    display: flex; flex-direction: column; padding: 16px; gap: 16px;
    overflow-y: auto;
  }
  .sidebar h2 { font-size: 13px; color: #666; text-transform: uppercase; letter-spacing: 0.5px; }

  .file-section { display: flex; flex-direction: column; gap: 8px; }
  .file-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
  .file-item {
    padding: 6px 10px; border-radius: 6px; font-size: 12px;
    cursor: pointer; border: 1px solid #e0e0e0; background: #fafafa;
    display: flex; align-items: center; justify-content: space-between;
  }
  .file-item:hover { background: #e8f0fe; border-color: #4a90d9; }
  .file-item.selected { background: #e8f0fe; border-color: #4a90d9; color: #1a73e8; font-weight: 600; }
  .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px; }

  .btn {
    padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer;
    font-size: 13px; font-weight: 500; transition: background 0.15s;
  }
  .btn-primary { background: #1a73e8; color: #fff; }
  .btn-primary:hover { background: #1557b0; }
  .btn-secondary { background: #f1f3f4; color: #333; }
  .btn-secondary:hover { background: #e0e0e0; }
  .btn-danger { background: #ea4335; color: #fff; }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  input[type="file"] { font-size: 12px; }
  .upload-progress { font-size: 12px; color: #666; }

  /* 탭 */
  .tabs { display: flex; gap: 4px; border-bottom: 2px solid #e0e0e0; margin-bottom: 12px; }
  .tab {
    padding: 8px 16px; border-radius: 6px 6px 0 0; cursor: pointer;
    font-size: 13px; font-weight: 500; color: #666; border: none; background: none;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .tab:hover { background: #f1f3f4; }

  /* 채팅 영역 */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }

  .msg { max-width: 75%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1a73e8; color: #fff; border-radius: 12px 12px 2px 12px; }
  .msg.assistant { align-self: flex-start; background: #fff; border: 1px solid #e0e0e0; border-radius: 12px 12px 12px 2px; }
  .msg.system { align-self: center; background: #fff3cd; border: 1px solid #ffc107; font-size: 12px; color: #856404; border-radius: 8px; }
  .msg.error { align-self: center; background: #fce8e6; border: 1px solid #ea4335; font-size: 12px; color: #c5221f; border-radius: 8px; }

  .msg .references { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e0e0e0; font-size: 12px; color: #666; }
  .msg .ref-item { display: inline-block; margin: 2px 4px 2px 0; padding: 2px 8px; background: #e8f0fe; border-radius: 12px; color: #1a73e8; }

  .streaming { border-left: 3px solid #1a73e8; padding-left: 10px; }
  .cursor { display: inline-block; width: 8px; height: 14px; background: #1a73e8; animation: blink 0.8s infinite; vertical-align: middle; margin-left: 2px; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

  .progress-bar-wrap { background: #e0e0e0; border-radius: 4px; height: 6px; overflow: hidden; margin-top: 4px; }
  .progress-bar { height: 100%; background: #1a73e8; transition: width 0.3s; border-radius: 4px; }

  /* 입력창 */
  .input-area {
    padding: 16px; background: #fff; border-top: 1px solid #e0e0e0;
    display: flex; gap: 8px; align-items: flex-end;
  }
  .input-area textarea {
    flex: 1; padding: 10px 14px; border: 1px solid #e0e0e0; border-radius: 12px;
    font-size: 14px; resize: none; font-family: inherit; max-height: 120px;
    outline: none;
  }
  .input-area textarea:focus { border-color: #1a73e8; }

  .mode-badge {
    font-size: 11px; padding: 3px 8px; border-radius: 12px; font-weight: 600;
    background: #e8f0fe; color: #1a73e8;
  }
  .mode-badge.private { background: #fce8e6; color: #ea4335; }
  .mode-badge.summary { background: #e6f4ea; color: #188038; }

  .divider { height: 1px; background: #e0e0e0; margin: 8px 0; }
  .empty-msg { color: #aaa; font-size: 13px; text-align: center; margin-top: 40px; }

  pre { white-space: pre-wrap; font-family: inherit; }

  /* 메인 탭 */
  .main-tabs { display: flex; background: #fff; border-bottom: 2px solid #e0e0e0; }
  .main-tab {
    padding: 12px 24px; font-size: 14px; font-weight: 500; color: #666;
    border: none; background: none; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .main-tab.active { color: #1a73e8; border-bottom-color: #1a73e8; }
  .main-tab:hover { background: #f1f3f4; }

  /* 문서 자동화 패널 */
  .doc-auto-panel {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .doc-auto-panel label { font-size: 13px; font-weight: 500; color: #444; display: block; margin-bottom: 6px; }
  .doc-auto-panel select, .doc-auto-panel input[type="number"] {
    width: 100%; padding: 8px 12px; border: 1px solid #e0e0e0; border-radius: 6px;
    font-size: 13px; outline: none;
  }
  .doc-auto-panel select:focus, .doc-auto-panel input:focus { border-color: #1a73e8; }
  .doc-auto-panel textarea {
    width: 100%; padding: 10px 12px; border: 1px solid #e0e0e0; border-radius: 6px;
    font-size: 12px; font-family: 'Consolas', monospace; resize: vertical; outline: none;
    min-height: 200px;
  }
  .doc-auto-panel textarea:focus { border-color: #1a73e8; }
  .doc-auto-result {
    padding: 14px; border-radius: 8px; font-size: 13px;
    border: 1px solid #e0e0e0; background: #fafafa; display: none;
  }
  .doc-auto-result.success { background: #e6f4ea; border-color: #34a853; }
  .doc-auto-result.error { background: #fce8e6; border-color: #ea4335; }
  .download-link {
    display: inline-block; margin-top: 8px; padding: 8px 16px;
    background: #1a73e8; color: #fff; border-radius: 6px;
    text-decoration: none; font-weight: 500; font-size: 13px;
  }
  .download-link:hover { background: #1557b0; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }

  /* 대화록 요약 */
  .dialogue-result-box {
    padding: 12px; border: 1px solid #e0e0e0; border-radius: 6px;
    background: #fafafa; font-size: 13px; white-space: pre-wrap;
    max-height: 220px; overflow-y: auto; line-height: 1.6;
  }
  .daily-item {
    border: 1px solid #e0e0e0; border-radius: 6px; margin-bottom: 8px; overflow: hidden;
  }
  .daily-date {
    background: #e8f0fe; color: #1a73e8; font-weight: 600; font-size: 12px;
    padding: 6px 12px;
  }
  .daily-summary {
    padding: 10px 12px; font-size: 12px; white-space: pre-wrap;
    font-family: inherit; line-height: 1.6; max-height: 160px; overflow-y: auto; margin: 0;
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>AI Service 테스트 UI</h1>
  <div>
    <label>API URL</label><br>
    <input type="text" id="apiUrl">
  </div>
  <div>
    <label>invoke ID</label><br>
    <input type="text" id="invokeId" value="test-room-01">
  </div>
</div>

<div class="layout">
  <!-- 사이드바 -->
  <div class="sidebar">
    <div>
      <h2>파일 업로드</h2>
      <div class="file-section" style="margin-top:8px;">
        <input type="file" id="fileInput">
        <button class="btn btn-primary btn-sm" onclick="uploadFile()">업로드</button>
        <div class="upload-progress" id="uploadProgress"></div>
        <div class="progress-bar-wrap" id="uploadBarWrap" style="display:none">
          <div class="progress-bar" id="uploadBar" style="width:0%"></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <div>
      <h2 style="margin-bottom:8px;">업로드된 파일</h2>
      <div class="file-list" id="fileList">
        <div class="empty-msg">파일 없음</div>
      </div>
      <button class="btn btn-secondary btn-sm" style="margin-top:8px;width:100%" onclick="loadFiles()">새로고침</button>
    </div>

    <div class="divider"></div>

    <div>
      <h2 style="margin-bottom:8px;">선택된 파일</h2>
      <div id="selectedFile" style="font-size:12px;color:#666;">없음</div>
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn btn-secondary btn-sm" onclick="setMode('open')">Open 채팅</button>
        <button class="btn btn-secondary btn-sm" onclick="setMode('private')">Private 채팅</button>
        <button class="btn btn-secondary btn-sm" onclick="setMode('summary')">문서 요약</button>
      </div>
    </div>
  </div>

  <!-- 메인 -->
  <div class="main">
    <!-- 메인 탭 -->
    <div class="main-tabs">
      <button class="main-tab active" id="tabChat" onclick="switchMainTab('chat')">채팅</button>
      <button class="main-tab" id="tabDocAuto" onclick="switchMainTab('docauto')">문서 자동화</button>
      <button class="main-tab" id="tabDialogue" onclick="switchMainTab('dialogue')">대화록 요약</button>
    </div>

    <!-- 채팅 패널 -->
    <div id="panelChat" style="flex:1;display:flex;flex-direction:column;overflow:hidden;">
      <div style="padding:12px 20px;border-bottom:1px solid #e0e0e0;display:flex;align-items:center;gap:10px;background:#fff;">
        <span>모드:</span>
        <span class="mode-badge" id="modeBadge">Open 채팅</span>
        <span id="modeFile" style="font-size:12px;color:#666;"></span>
      </div>
      <div class="chat-area" id="chatArea">
        <div class="empty-msg">메시지를 입력하거나 파일을 업로드하세요</div>
      </div>
      <div class="input-area">
        <textarea id="msgInput" rows="1" placeholder="메시지 입력... (Shift+Enter: 줄바꿈, Enter: 전송)"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()">전송</button>
      </div>
    </div>

    <!-- 대화록 요약 패널 -->
    <div id="panelDialogue" style="display:none;flex:1;overflow:hidden;">
      <div class="doc-auto-panel">
        <div>
          <label>CSV 파일 선택</label>
          <input type="file" id="dialogueCsvInput" accept=".csv" style="font-size:13px;">
        </div>
        <button class="btn btn-primary" id="dialogueBtn" onclick="runDialogueSummary()">대화록 요약 시작</button>

        <div id="dialogueProgress" style="display:none;">
          <div id="dialogueProgressText" style="font-size:13px;color:#666;margin-bottom:4px;">준비 중...</div>
          <div class="progress-bar-wrap">
            <div class="progress-bar" id="dialogueProgressBar" style="width:0%"></div>
          </div>
        </div>

        <div id="dialogueResultSection" style="display:none;">
          <div style="margin-bottom:16px;">
            <label>전체 요약</label>
            <div class="dialogue-result-box" id="dialogueOverall"></div>
          </div>
          <div>
            <label>날짜별 요약</label>
            <div id="dialogueDaily"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 문서 자동화 패널 -->
    <div id="panelDocAuto" style="display:none;flex:1;overflow:hidden;">
      <div class="doc-auto-panel">
        <div>
          <label>템플릿 선택</label>
          <select id="templateSelect" onchange="onTemplateChange()">
            <option value="template.hwpx">template.hwpx (기안문/시행문)</option>
            <option value="template2.hwpx">template2.hwpx (일반 공문)</option>
            <option value="template3.hwpx">template3.hwpx (회의록)</option>
          </select>
        </div>
        <div>
          <label>context_data (JSON)</label>
          <textarea id="contextData"></textarea>
        </div>
        <div style="display:flex;gap:16px;align-items:flex-end;">
          <div style="flex:1;">
            <label>링크 만료 시간 (초)</label>
            <input type="number" id="expiresIn" value="3600" min="60">
          </div>
          <div class="checkbox-row" style="padding-bottom:8px;">
            <input type="checkbox" id="oneTime" checked>
            <label for="oneTime" style="margin:0;">1회용 링크</label>
          </div>
        </div>
        <button class="btn btn-primary" id="generateBtn" onclick="generateDocument()">문서 생성</button>
        <div class="doc-auto-result" id="docAutoResult"></div>
      </div>
    </div>
  </div>
</div>

<script>
let currentMode = 'open'; // 'open' | 'private' | 'summary'
let selectedFilename = null;
let isStreaming = false;

function getApiUrl() { return document.getElementById('apiUrl').value.replace(/\/$/, ''); }
function getInvokeId() { return document.getElementById('invokeId').value.trim(); }

function setMode(mode) {
  currentMode = mode;
  const badge = document.getElementById('modeBadge');
  const modeFile = document.getElementById('modeFile');
  badge.className = 'mode-badge';
  if (mode === 'open') { badge.textContent = 'Open 채팅'; modeFile.textContent = ''; }
  else if (mode === 'private') {
    badge.textContent = 'Private 채팅'; badge.classList.add('private');
    modeFile.textContent = selectedFilename ? `파일: ${selectedFilename}` : '파일 선택 필요';
  }
  else if (mode === 'summary') {
    badge.textContent = '문서 요약'; badge.classList.add('summary');
    modeFile.textContent = selectedFilename ? `파일: ${selectedFilename}` : '파일 선택 필요';
  }
}

function selectFile(filename) {
  selectedFilename = filename;
  document.getElementById('selectedFile').textContent = filename;
  document.querySelectorAll('.file-item').forEach(el => {
    el.classList.toggle('selected', el.dataset.filename === filename);
  });
  setMode(currentMode);
}

async function loadFiles() {
  const invokeId = getInvokeId();
  try {
    const res = await fetch(`${getApiUrl()}/files/${invokeId}`);
    const data = await res.json();
    const list = document.getElementById('fileList');
    if (!data.files || data.files.length === 0) {
      list.innerHTML = '<div class="empty-msg">파일 없음</div>';
      return;
    }
    list.innerHTML = data.files.map(f => `
      <div class="file-item" data-filename="${f}" onclick="selectFile('${f}')">
        <span class="file-name">${f}</span>
      </div>
    `).join('');
    if (selectedFilename) {
      document.querySelectorAll('.file-item').forEach(el => {
        if (el.dataset.filename === selectedFilename) el.classList.add('selected');
      });
    }
  } catch(e) {
    document.getElementById('fileList').innerHTML = '<div class="empty-msg" style="color:#ea4335">로드 실패</div>';
  }
}

async function uploadFile() {
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files[0]) { alert('파일을 선택하세요'); return; }
  const invokeId = getInvokeId();
  const file = fileInput.files[0];

  const formData = new FormData();
  formData.append('attachFile_bin', file);
  formData.append('attachFile_name', file.name);

  document.getElementById('uploadProgress').textContent = '업로드 시작...';
  document.getElementById('uploadBarWrap').style.display = 'block';
  document.getElementById('uploadBar').style.width = '0%';

  try {
    const res = await fetch(`${getApiUrl()}/upload/${invokeId}`, { method: 'POST', body: formData });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const text = decoder.decode(value);
      for (const line of text.split('\n')) {
        if (!line.startsWith('data:')) continue;
        try {
          const data = JSON.parse(line.slice(5).trim());
          if (data.type === 'progress') {
            document.getElementById('uploadProgress').textContent = `${data.percent}% - ${data.message}`;
            document.getElementById('uploadBar').style.width = data.percent + '%';
          } else if (data.type === 'done') {
            document.getElementById('uploadProgress').textContent = '완료!';
            document.getElementById('uploadBar').style.width = '100%';
            loadFiles();
          } else if (data.type === 'error') {
            document.getElementById('uploadProgress').textContent = '오류: ' + data.detail;
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    document.getElementById('uploadProgress').textContent = '업로드 실패: ' + e.message;
  }
}

function appendMsg(role, content, refs) {
  const area = document.getElementById('chatArea');
  const empty = area.querySelector('.empty-msg');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
  if (refs && refs.length > 0) {
    const refDiv = document.createElement('div');
    refDiv.className = 'references';
    refDiv.innerHTML = '📎 참조: ' + refs.map(r =>
      `<span class="ref-item">${r.source}${r.page ? ' p.' + r.page : ''}</span>`
    ).join('');
    div.appendChild(refDiv);
  }
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function appendStreamingMsg() {
  const area = document.getElementById('chatArea');
  const empty = area.querySelector('.empty-msg');
  if (empty) empty.remove();

  const div = document.createElement('div');
  div.className = 'msg assistant streaming';
  div.innerHTML = '<pre id="streamContent"></pre><span class="cursor"></span>';
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function appendProgress(percent, message) {
  const area = document.getElementById('chatArea');
  let progDiv = document.getElementById('progressMsg');
  if (!progDiv) {
    progDiv = document.createElement('div');
    progDiv.id = 'progressMsg';
    progDiv.className = 'msg system';
    progDiv.innerHTML = `<div id="progText"></div><div class="progress-bar-wrap"><div class="progress-bar" id="progBar"></div></div>`;
    area.appendChild(progDiv);
  }
  document.getElementById('progText').textContent = `${percent}% - ${message}`;
  document.getElementById('progBar').style.width = percent + '%';
  area.scrollTop = area.scrollHeight;
}

function removeProgress() {
  const p = document.getElementById('progressMsg');
  if (p) p.remove();
}

function escapeHtml(text) {
  return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function sendMessage() {
  if (isStreaming) return;
  const msgInput = document.getElementById('msgInput');
  const msg = msgInput.value.trim();
  const invokeId = getInvokeId();

  if (currentMode === 'summary') {
    if (!selectedFilename) { alert('요약할 파일을 선택하세요'); return; }
    msgInput.value = '';
    autoResize(msgInput);
    await runSummary(invokeId);
    return;
  }

  if (!msg) return;
  if (currentMode === 'private' && !selectedFilename) { alert('파일을 선택하세요'); return; }

  appendMsg('user', msg);
  msgInput.value = '';
  autoResize(msgInput);

  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  const streamDiv = appendStreamingMsg();
  const contentEl = document.getElementById('streamContent');
  let refs = [];
  let fullContent = '';

  try {
    const formData = new FormData();
    formData.append('message', msg);
    if (currentMode === 'private') formData.append('target_filename', selectedFilename);

    const url = currentMode === 'private'
      ? `${getApiUrl()}/message/private/${invokeId}`
      : `${getApiUrl()}/message/open/${invokeId}`;

    const res = await fetch(url, { method: 'POST', body: formData });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const text = decoder.decode(value);
      for (const line of text.split('\n')) {
        if (!line.startsWith('data:')) continue;
        try {
          const data = JSON.parse(line.slice(5).trim());
          if (data.type === 'answer') {
            fullContent += data.content;
            contentEl.textContent = fullContent;
          } else if (data.type === 'references') {
            refs = data.docs || [];
          } else if (data.type === 'error') {
            streamDiv.className = 'msg error';
            contentEl.textContent = '오류: ' + data.detail;
          }
        } catch(e) {}
      }
      document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
    }
  } catch(e) {
    contentEl.textContent = '연결 오류: ' + e.message;
    streamDiv.className = 'msg error';
  }

  // 스트리밍 완료 처리
  streamDiv.classList.remove('streaming');
  const cursor = streamDiv.querySelector('.cursor');
  if (cursor) cursor.remove();
  if (refs.length > 0) {
    const refDiv = document.createElement('div');
    refDiv.className = 'references';
    refDiv.innerHTML = '📎 참조: ' + refs.map(r =>
      `<span class="ref-item">${r.source}${r.page ? ' p.' + r.page : ''}</span>`
    ).join('');
    streamDiv.appendChild(refDiv);
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

async function runSummary(invokeId) {
  isStreaming = true;
  document.getElementById('sendBtn').disabled = true;

  appendMsg('user', `📄 "${selectedFilename}" 문서 요약 요청`);

  const streamDiv = appendStreamingMsg();
  const contentEl = document.getElementById('streamContent');
  let refs = [];
  let fullContent = '';

  try {
    const formData = new FormData();
    formData.append('target_filename', selectedFilename);

    const res = await fetch(`${getApiUrl()}/message/document-summary/${invokeId}`, { method: 'POST', body: formData });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      const text = decoder.decode(value);
      for (const line of text.split('\n')) {
        if (!line.startsWith('data:')) continue;
        try {
          const data = JSON.parse(line.slice(5).trim());
          if (data.type === 'progress') {
            appendProgress(data.percent, data.message);
          } else if (data.type === 'answer') {
            removeProgress();
            fullContent += data.content;
            contentEl.textContent = fullContent;
          } else if (data.type === 'references') {
            refs = data.docs || [];
          } else if (data.type === 'error') {
            removeProgress();
            streamDiv.className = 'msg error';
            contentEl.textContent = '오류: ' + data.detail;
          } else if (data.type === 'done') {
            removeProgress();
          }
        } catch(e) {}
      }
      document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
    }
  } catch(e) {
    removeProgress();
    contentEl.textContent = '연결 오류: ' + e.message;
    streamDiv.className = 'msg error';
  }

  streamDiv.classList.remove('streaming');
  const cursor = streamDiv.querySelector('.cursor');
  if (cursor) cursor.remove();
  if (refs.length > 0) {
    const refDiv = document.createElement('div');
    refDiv.className = 'references';
    refDiv.innerHTML = '📎 참조: ' + refs.map(r =>
      `<span class="ref-item">${r.source}${r.page ? ' p.' + r.page : ''}</span>`
    ).join('');
    streamDiv.appendChild(refDiv);
  }

  isStreaming = false;
  document.getElementById('sendBtn').disabled = false;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (currentMode === 'summary') runSummary(getInvokeId());
    else sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

// 메인 탭 전환
function switchMainTab(tab) {
  const panels = { chat: 'panelChat', docauto: 'panelDocAuto', dialogue: 'panelDialogue' };
  const tabBtns = { chat: 'tabChat', docauto: 'tabDocAuto', dialogue: 'tabDialogue' };
  Object.keys(panels).forEach(key => {
    const isActive = key === tab;
    const panel = document.getElementById(panels[key]);
    panel.style.display = isActive ? 'flex' : 'none';
    if (isActive && key !== 'chat') panel.style.flexDirection = 'column';
    document.getElementById(tabBtns[key]).classList.toggle('active', isActive);
  });
}

async function generateDocument() {
  const template = document.getElementById('templateSelect').value;
  const contextDataStr = document.getElementById('contextData').value.trim();
  const expiresIn = parseInt(document.getElementById('expiresIn').value) || 3600;
  const oneTime = document.getElementById('oneTime').checked;
  const resultDiv = document.getElementById('docAutoResult');
  const btn = document.getElementById('generateBtn');

  if (!contextDataStr) { alert('context_data를 입력하세요'); return; }
  try { JSON.parse(contextDataStr); } catch(e) { alert('유효한 JSON이 아닙니다: ' + e.message); return; }

  btn.disabled = true;
  btn.textContent = '생성 중...';
  resultDiv.style.display = 'none';
  resultDiv.className = 'doc-auto-result';

  try {
    const formData = new FormData();
    formData.append('template_name', template);
    formData.append('context_data', contextDataStr);
    formData.append('expires_in', expiresIn);
    formData.append('one_time', oneTime);

    const res = await fetch(`${getApiUrl()}/documents/generate-hwpx`, { method: 'POST', body: formData });
    const data = await res.json();

    if (data.success) {
      resultDiv.className = 'doc-auto-result success';
      resultDiv.innerHTML = `
        <strong>문서 생성 완료!</strong><br>
        파일명: ${data.filename}<br>
        만료: ${new Date(data.expires_at).toLocaleString()}<br>
        1회용: ${data.one_time ? '예' : '아니오'}<br>
        <a class="download-link" href="${getApiUrl()}${data.download_url}" download="${data.filename}">다운로드</a>
      `;
    } else {
      resultDiv.className = 'doc-auto-result error';
      resultDiv.innerHTML = `<strong>오류:</strong> ${JSON.stringify(data)}`;
    }
  } catch(e) {
    resultDiv.className = 'doc-auto-result error';
    resultDiv.innerHTML = `<strong>연결 오류:</strong> ${e.message}`;
  }

  resultDiv.style.display = 'block';
  btn.disabled = false;
  btn.textContent = '문서 생성';
}

// 대화록 요약
async function runDialogueSummary() {
  const fileInput = document.getElementById('dialogueCsvInput');
  if (!fileInput.files[0]) { alert('CSV 파일을 선택하세요'); return; }

  const btn = document.getElementById('dialogueBtn');
  btn.disabled = true;
  btn.textContent = '처리 중...';

  const progressDiv = document.getElementById('dialogueProgress');
  const resultSection = document.getElementById('dialogueResultSection');
  progressDiv.style.display = 'block';
  resultSection.style.display = 'none';
  document.getElementById('dialogueProgressText').textContent = '요청 중...';
  document.getElementById('dialogueProgressBar').style.width = '0%';

  const STEP_PERCENT = { csv_parse: 10, segments_ready: 30, daily_summary: 60, overall_summary: 90 };
  let resultData = null;

  try {
    const formData = new FormData();
    formData.append('csv_file', fileInput.files[0]);

    const res = await fetch(`${getApiUrl()}/convert/dialogue-summary`, { method: 'POST', body: formData });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        if (!line.startsWith('data:')) continue;
        try {
          const data = JSON.parse(line.slice(5).trim());
          if (data.type === 'progress') {
            const percent = STEP_PERCENT[data.step] || 50;
            document.getElementById('dialogueProgressText').textContent = data.message || data.step || '';
            document.getElementById('dialogueProgressBar').style.width = percent + '%';
          } else if (data.type === 'result') {
            resultData = data;
            document.getElementById('dialogueProgressBar').style.width = '100%';
          } else if (data.type === 'done') {
            progressDiv.style.display = 'none';
            if (resultData) { displayDialogueResult(resultData); resultSection.style.display = 'block'; }
          } else if (data.type === 'error') {
            document.getElementById('dialogueProgressText').textContent = '오류: ' + (data.message || '알 수 없는 오류');
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    document.getElementById('dialogueProgressText').textContent = '연결 오류: ' + e.message;
  }

  btn.disabled = false;
  btn.textContent = '대화록 요약 시작';
}

function displayDialogueResult(data) {
  const overall = data.overall_summary || '';
  const daily = data.daily_summaries || [];
  document.getElementById('dialogueOverall').textContent = overall;
  document.getElementById('dialogueDaily').innerHTML = daily.map(d =>
    `<div class="daily-item">
      <div class="daily-date">${escapeHtml(d.date)}</div>
      <pre class="daily-summary">${escapeHtml(d.summary)}</pre>
    </div>`
  ).join('');
}
