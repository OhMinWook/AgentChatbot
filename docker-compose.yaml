services:
  # ── LLM Gateway (FastAPI) ──────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm_gateway
    ports:
      - "8000:8000"
    environment:
      - MODEL_SERVER_URL=${MODEL_SERVER_URL:-http://host.docker.internal:21440}
      - VLLM_MODEL=${VLLM_MODEL:-LGAI-EXAONE/EXAONE-4.0-32B-AWQ}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - QDRANT_COLLECTION=${QDRANT_COLLECTION:-documents}
      - UPLOAD_DIR=/data/uploaded_files
    volumes:
      - uploaded_files:/data/uploaded_files
      - ./libs:/app/libs    # Polaris JAR 파일
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  # ── Redis (대화 히스토리, 캐싱) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: llm_gateway_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ── Qdrant (벡터 DB: Dense + Sparse 하이브리드 검색) ────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: llm_gateway_qdrant
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 3
    restart: unless-stopped

volumes:
  redis_data:
  qdrant_data:
  uploaded_files:
